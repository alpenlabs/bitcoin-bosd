[package]
name = "bitcoin-bosd"
edition = "2021"
version = "0.11.0"
authors = [
  "Trey Del Bonis <trey@alpenlabs.io>",
  "Jose Storopoli <jose@alpenlabs.io>",
]
description = "Rust implementation of a Bitcoin binary output script descriptor (BOSD)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/alpenlabs/bitcoin-bosd"
categories = ["cryptography::cryptocurrencies"]
keywords = ["crypto", "bitcoin"]

[features]
default = ["address", "serde"]
address = ["dep:bitcoin"]
serde = ["dep:serde"]
borsh = ["dep:borsh"]
arbitrary = ["dep:arbitrary"]
ssz = ["dep:ssz", "dep:ssz_types"]

[dependencies]
arbitrary = { version = "1.4.2", optional = true }
bitcoin = { version = "0.32.8", optional = true }
borsh = { version = "1.6.1", optional = true }
hex = { package = "hex-conservative", version = "0.2.1" } # for optimization keep in sync with bitcoin
secp256k1 = { version = "0.29.1", features = [ # for optimization keep in sync with bitcoin
  "global-context",
] }
serde = { version = "1.0.228", optional = true }
ssz = { git = "https://github.com/alpenlabs/ssz-gen", version = "0.16.0", tag = "v0.16.0", package = "ssz", optional = true }
ssz_types = { git = "https://github.com/alpenlabs/ssz-gen", version = "0.16.0", tag = "v0.16.0", package = "ssz_types", optional = true }

[dev-dependencies]
bincode = "1.3.3"
proptest = "1.11.0"
serde_json = "1.0.149"
rand_core = { version = "0.6.4", features = ["getrandom"] }

[profile.release]
opt-level = "z"   # Optimized for size, use 3 for speed
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Reduced to increase optimizations
panic = "abort"   # Abort on panic
strip = "symbols" # Strip symbols from binary

[[example]]
name = "psbt"
